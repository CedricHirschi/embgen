name: example_registers
description: Example Register Map
width: 32
access_separate: true

registers:
  - name: CONTROL
    description: Control Register
    address: 0x00
    bitfields:
      - name: ENABLE
        description: Enable the device
        reset: 0
        width: 1
        offset: 0
      - name: MODE
        description: Operating mode
        reset: ACTIVE
        width: 2
        offset: 3
        enums:
          - { name: SHUTDOWN, value: 0, description: Device is shut down }
          - { name: IDLE, value: 1, description: Device is idle }
          - { name: ACTIVE, value: 2, description: Device is active }
          - { name: RESERVED, value: 3, description: Reserved mode }
  - name: STATUS
    description: Status Register
    address: 0x04
    access: r
    access_hw: w
    bitfields:
      - name: READY
        description: Device ready status
        reset: 0
        width: 1
        offset: 0
      - name: ERROR
        description: Error status
        reset: 0
        width: 1
        offset: 8
