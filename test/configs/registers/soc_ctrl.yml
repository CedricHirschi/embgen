name: soc_ctrl

access_separate: true
width: 32

regmap:
  - name: BOOTADDR
    description: "Core Boot Address"
    address: 0
    access: rw
    access_hw: hro
    bitfields:
      - name: ADDR
        description: "Boot address for the core"
        width: 32
        offset: 0
        reset: 0x0300_D000
  - name: FETCHEN
    description: "Core Fetch Enable"
    address: 1
    access: rw
    access_hw: hro
    bitfields:
      - name: EN
        description: "Enable or disable instruction fetch for the core"
        width: 1
        offset: 0
        reset: 1
  - name: CORESTATUS
    description: "Core Return Status (return value, EOC)"
    address: 2
    access: rw
    access_hw: hro
    bitfields:
      - name: CORE_STATUS
        description: "Core Return Status (EOC(bit[31]) and status(bit[30:0]))"
        width: 32
        offset: 0
        reset: 0
  - name: BOOTMODE
    description: "Core Boot Mode"
    address: 3
    access: rw
    access_hw: hrw
    bitfields:
      - name: BOOTMODE
        description: "Boot Mode"
        width: 1
        offset: 0
        reset: 0
  - name: SRAM_DLY
    description: "SRAM A_DLY value"
    address: 4
    access: rw
    access_hw: hro
    bitfields:
      - name: SRAM_DLY
        description: "Controls the A_DLY pin of the SRAMs (configured internal timings)"
        width: 1
        offset: 0
        reset: 1
  - name: RESTART_COUNTER
    description: "Bootrom restarts counter"
    address: 5
    access: rw
    access_hw: hrw
    bitfields:
      - name: RESTART_COUNTER
        description: "Restart Counter"
        width: 32
        offset: 0
        reset: 0
  - name: BOOTADDR_AFTER
    description: "Core Boot Address After Bootrom"
    address: 6
    access: rw
    access_hw: hro
    bitfields:
      - name: BOOTADDR_AFTER
        description: "Boot Address After Bootrom"
        width: 32
        offset: 0
        reset: 0x1000_0000
  - name: BOOTADDR_AFTER_SD
    description: "Core Boot Address After Bootrom if SD Card is attached"
    address: 7
    access: rw
    access_hw: hro
    bitfields:
      - name: BOOTADDR_AFTER_SD
        description: "Boot Address After Bootrom if SD Card is attached"
        width: 32
        offset: 0
        reset: 0x6000_0000
