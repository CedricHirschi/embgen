# Example regtool compatible YAML file from here: https://github.com/pulp-platform/pulser
name: pulser_general

access_separate: true
width: 32

regmap:
  - name: CTRL
    description: "Start and Stop the pulser. No registers generated, commands handled in pulser"
    address: 0
    access: wo
    access_hw: hro
    hwqe: true
    hwext: true
    bitfields:
      - name: START
        description: "Set one to start the pulser."
        width: 16
        offset: 0
        reset: 0
      - name: STOP
        description: "Set one to stop the pulser."
        width: 16
        offset: 16
        reset: 0
  - name: CFG
    description: "Set global configs of Pulsers. Currently only enable is active"
    address: 1
    access: rw
    access_hw: hro
    bitfields:
      - name: EN
        description: "Activate / Deactivate Pulser (enable / disable clk)."
        width: 16
        offset: 0
        reset: 0
