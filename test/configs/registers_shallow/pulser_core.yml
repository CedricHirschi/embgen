# Example regtool compatible YAML file from here: https://github.com/pulp-platform/pulser
name: pulser_core

access_separate: true
width: 32

regmap_shallow:
  - name: CFG_F
    numbers: [1, 2]
    description: "Phase configuration: end and switch points"
    address: 0
    access: rw
    access_hw: hro
    bitfields:
      - name: SWITCHVAL
        description: "Number of cycles until switch (set duty cycle)"
        width: 16
        offset: 0
        reset: 0
      - name: ENDVAL
        description: "Number of cycles until pulse done (set frequency)"
        width: 16
        offset: 16
        reset: 0
  - name: CFG_CNT
    description: "Configure number of pulses for each phase"
    access: rw
    access_hw: hro
    address: 2
    bitfields:
      - name: F1
        description: "Number of F1"
        width: 8
        offset: 0
        reset: 0
      - name: F2
        description: "Number of F2"
        width: 8
        offset: 8
        reset: 0
      - name: CNT_STOP
        description: "Number of stop pulses"
        width: 8
        offset: 16
        reset: 0
  - name: STATUS
    description: "Read state of pulser"
    address: 3
    access: ro
    access_hw: hwo
    bitfields:
      - name: READY
        description: "High, if pulser is ready to start next pulsing phase"
        width: 1
        offset: 0
        reset: 0
      - name: STATE
        description: "Current state of the pulser"
        width: 3
        offset: 1
        reset: 0
        enums:
          - { name: IDLE, value: 0, description: "Idle state" }
          - { name: RUNNING_F1, value: 1, description: "Running in F1 state" }
          - { name: RUNNING_F2, value: 2, description: "Running in F2 state" }
          - {
              name: RUNNING_STOP,
              value: 3,
              description: "Running in STOP state",
            }
          - { name: DONE, value: 4, description: "Done state" }
  - name: CTRL_OUT
    description: "Set idle state of pulser and if pulse phase should be inverted"
    address: 4
    access: rw
    access_hw: hro
    bitfields:
      - name: INVERT_OUT
        description: "Set 1, if pulser output should be inverted during pulsing phase."
        width: 1
        offset: 0
        reset: 0
      - name: IDLE_OUT
        description: "Control output during idle: 1 to set to 1, 0 to set to 0."
        width: 1
        offset: 1
        reset: 0
