name: Telemetry
file: telemetry

max_count: 40

methods:
  - name: ping
    description: "Ping the device"
    args:
      - name: probe_id
        type: B
        default: 1
        description: "Probe identifier"
    returns:
      - name: status
        enum_name: PingStatus
        enums:
          - {
              name: OK,
              value: 0,
              description: "The ping completed successfully",
            }
          - { name: ERROR, value: 1, description: "The ping failed" }
        description: "Ping status"

  - name: setmode
    description: "Switch the device operating mode"
    args:
      - name: mode
        enum_name: OperatingMode
        enums:
          - { name: AUTO, value: 0, description: "Automatic mode" }
          - { name: MANUAL, value: 1, description: "Manual mode" }
        default: AUTO
        description: "Requested operating mode"
      - name: enabled
        type: "?"
        default: true
        description: "Enable or disable the selected mode"
    returns:
      - name: applied
        type: "?"
        description: "Whether the requested mode was applied"

  - name: writefpga
    description: "Write to a FPGA register"
    args:
      - name: address
        type: I
        description: "Address of the FPGA register to write"
      - name: value
        type: I
        description: "Value to write to the FPGA register"
